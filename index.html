<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Campo">
  <title>Campo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/dexie.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="banner-actualizacion" class="banner" role="status" hidden>
    <span>Nueva versión disponible</span>
    <button type="button" id="btn-actualizar" class="btn btn-claro">Actualizar</button>
  </div>

  <header class="topbar">
    <a href="#/movimientos" class="marca">
      <img src="icons/icon-192.png" alt="" width="28" height="28">
      <span>Campo</span>
    </a>
    <button type="button" id="estado-sync" class="estado-sync" title="Estado de sincronización"></button>
  </header>

  <nav class="nav" aria-label="Navegación principal">
    <a href="#/movimientos" data-ruta="movimientos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Movimientos</span>
    </a>
    <a href="#/movimientos/nuevo" data-ruta="nuevo" class="nav-nuevo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Nuevo</span>
    </a>
    <a href="#/campanas" data-ruta="campanas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9M12 13c-3 0-5-2-5-5 3 0 5 2 5 5zM12 11c3 0 5-2 5-5-3 0-5 2-5 5zM4 21h16"/></svg>
      <span>Campañas</span>
    </a>
    <a href="#/mas" data-ruta="mas" class="solo-celular">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      <span>Más</span>
    </a>
    <a href="#/categorias" data-ruta="categorias" class="solo-notebook">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v5H4zM13 14h7v5h-7z"/></svg>
      <span>Categorías</span>
    </a>
    <a href="#/hermanos" data-ruta="hermanos" class="solo-notebook">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 010 6M18 15c2 .5 3 2.5 3 5"/></svg>
      <span>Hermanos</span>
    </a>
    <a href="#/configuracion" data-ruta="configuracion" class="solo-notebook">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      <span>Configuración</span>
    </a>
  </nav>

  <main id="vista" class="vista" tabindex="-1">
  </main>

  <div id="aviso-cotizaciones" class="aviso-global" role="status" hidden>
    <span id="aviso-cotizaciones-texto"></span>
    <span class="aviso-global-acciones">
      <button type="button" class="btn btn-claro" id="btn-recalcular">Recalcular</button>
      <button type="button" class="btn-link-claro" id="btn-recalcular-no">Ahora no</button>
    </span>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
